<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リアルタイム文字起こし</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 画面1: 初回のみ表示するAPIキー設定画面 -->
<section id="setup-screen" class="screen">
  <h1>Groq APIキーの設定</h1>
  <p class="lead">このアプリはあなたのGroq APIキーで文字起こしします。キーは端末内にのみ保存され、外部には送信されません。</p>

  <div class="howto">
    <h2>APIキーの取得方法</h2>
    <ol>
      <li><a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> を開く</li>
      <li>アカウントでログイン（未登録なら新規登録）</li>
      <li>「Create API Key」をクリックしてキーを作成</li>
      <li>表示された <code>gsk_</code> から始まるキーをコピーして下に貼り付け</li>
    </ol>
  </div>

  <label for="api-key-input">Groq APIキー</label>
  <input id="api-key-input" type="password" autocomplete="off" placeholder="gsk_...">
  <button id="save-key-btn" type="button" class="btn-primary">保存して始める</button>
  <p id="setup-error" class="error" hidden></p>
</section>

<!-- 画面2: メイン画面 -->
<section id="main-screen" class="screen" hidden>
  <header class="toolbar">
    <button id="open-list-btn" type="button" class="btn-icon" aria-label="会話一覧">☰</button>
    <div class="font-controls">
      <button id="font-smaller-btn" type="button" class="btn-icon" aria-label="文字を小さく">A−</button>
      <span id="font-size-label" class="font-size-label"></span>
      <button id="font-larger-btn" type="button" class="btn-icon" aria-label="文字を大きく">A＋</button>
    </div>
    <button id="open-settings-btn" type="button" class="btn-icon" aria-label="設定">⚙</button>
  </header>

  <div id="transcript" class="transcript" aria-live="polite"></div>

  <p id="main-error" class="error" hidden></p>

  <footer class="record-bar">
    <div class="record-controls">
      <div id="level-meter" class="level-meter" hidden aria-hidden="true">
        <div id="level-meter-fill" class="level-meter-fill"></div>
      </div>
      <button id="record-btn" type="button" class="btn-record">
        <span id="record-btn-label">録音開始</span>
      </button>
    </div>
  </footer>
</section>

<!-- 画面3: 会話一覧 -->
<section id="list-screen" class="screen" hidden>
  <header class="toolbar">
    <button id="back-from-list-btn" type="button" class="btn-icon" aria-label="戻る">←</button>
    <h1 class="toolbar-title">会話一覧</h1>
    <span class="toolbar-spacer" aria-hidden="true"></span>
  </header>
  <div id="conversation-list" class="conversation-list"></div>
</section>

<!-- 画面4: 会話詳細 -->
<section id="detail-screen" class="screen" hidden>
  <header class="toolbar">
    <button id="back-from-detail-btn" type="button" class="btn-icon" aria-label="戻る">←</button>
    <h1 id="detail-title" class="toolbar-title">会話</h1>
    <span class="toolbar-spacer" aria-hidden="true"></span>
  </header>
  <div id="detail-text" class="transcript"></div>
  <footer class="record-bar detail-actions">
    <button id="copy-detail-btn" type="button" class="btn-secondary">📋 コピー</button>
    <button id="share-detail-btn" type="button" class="btn-secondary" hidden>共有</button>
  </footer>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
